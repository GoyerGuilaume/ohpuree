<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pas de purée !</title>
<style>
:root{
  --lane-a:#fff1d6; --lane-b:#ffe6bd; --line:#e2c58f; --ink:#3b2a1a; --muted:#7b6446; --panel:#fffaf0;
  --accent:#e8892b; --accent-ink:#ffffff;
  --pin:#8a5a34; --metal:#c9d2da; --metal-dark:#7f8c97; --danger:#d1432f;
  --potato:#c8924b; --potato-edge:#8c5f2b; --flesh:#f6e3a4; --fry:#f2c94c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --lane-a:#2b1e15; --lane-b:#34241a; --line:#4a3524; --ink:#ffe9c7; --muted:#c3a47a; --panel:#3a2819;
  }
}
:root[data-theme="dark"]{
  --lane-a:#2b1e15; --lane-b:#34241a; --line:#4a3524; --ink:#ffe9c7; --muted:#c3a47a; --panel:#3a2819;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;background:var(--lane-a);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
#stage{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:11px;padding:18px;text-align:center;
  background:var(--lane-a);
  background:color-mix(in srgb,var(--lane-a) 92%,transparent);
}
.hidden{display:none}
h1{margin:0;font-size:2.1rem;line-height:1.1}
h2{margin:0;font-size:2rem}
.tag{margin:0;color:var(--muted);max-width:30ch}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(340px,100%)}
.row>span{font-weight:600}
.seg,.tabs{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button,.tabs button{
  appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:.95rem;
  padding:9px 12px;cursor:pointer;
}
.seg button.on,.tabs button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.hint{margin:0;color:var(--muted);font-size:.88rem;max-width:34ch;min-height:2.6em}
.big{
  appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;
  font-size:1.35rem;padding:14px 40px;border-radius:16px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);
}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.ghost{
  appearance:none;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;
  padding:10px 20px;border-radius:14px;cursor:pointer;
}
.ghost:disabled{opacity:.45;cursor:default}
.ghost.small{padding:6px 12px;font-size:.8rem;border-radius:10px}
.ghost.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.best{margin:0;color:var(--muted);font-size:.9rem}
.score{font-size:3.2rem;font-weight:800;margin:0}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.shop-list{
  display:flex;flex-direction:column;gap:8px;width:min(400px,100%);max-height:54vh;overflow-y:auto;
  touch-action:pan-y;
}
.item{
  display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);
  border-radius:14px;padding:10px 12px;text-align:left;
}
.item .t{flex:1}
.item small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.item .ghost{padding:8px 12px;white-space:nowrap}
.pausebtn{position:absolute;top:8px;right:8px;z-index:10;width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer;padding:0;opacity:.92}
.pausebtn.hidden{display:none}
.langsel{position:absolute;top:8px;right:8px}
.langsel button{padding:5px 8px;font-size:.78rem}
.item.done{border-color:var(--accent)}
.item.locked{opacity:.65}
.item .rw{font-weight:700;white-space:nowrap;font-size:.9rem}
#toast{
  position:absolute;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--lane-a);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:86%;
  text-align:center;transition:opacity .25s,transform .25s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div class="overlay" id="menu">
    <div class="seg langsel" data-key="lang"><button data-v="fr">FR</button><button data-v="en">EN</button><button data-v="es">ES</button><button data-v="de">DE</button></div>
    <h1>🥔 <span data-i18n="title">Pas de purée !</span></h1>

      <div class="seg" data-key="control"><button data-v="tilt" data-i18n="opt_tilt">Inclinaison</button><button data-v="tap" data-i18n="opt_tap">Tactile</button></div></div>
    <div class="row"><span data-i18n="lbl_mode">Mode</span>
      <div class="seg" data-key="mode"><button data-v="classic" data-i18n="opt_classic">Classique</button><button data-v="survive" data-i18n="opt_survive">Survie</button></div></div>
    <div class="row"><span data-i18n="lbl_sound">Son</span>
      <div class="seg" data-key="sound"><button data-v="on" data-i18n="opt_on">On</button><button data-v="off" data-i18n="opt_off">Off</button></div></div>
    <p class="hint" id="hint"></p>
    <div class="btns">
      <button class="big" id="play" data-i18n="play">Jouer</button>
      <button class="ghost" id="openAch" data-i18n="ach_btn">🏆 Succès</button>
      <button class="ghost" id="openShop" data-i18n="shop_btn">🛒 Boutique</button>
    </div>
    <p class="best" id="bestLine"></p>
    <button class="ghost small" id="devBtn">🛠 Mode dev : off</button>
  </div>

  <div class="overlay hidden" id="over">
    <h2 data-i18n="over_title">Purée ! 🥣</h2>
    <p class="score" id="finalScore">0 m</p>
    <p class="best" id="finalBest"></p>
    <p class="best" id="finalGold"></p>
    <p class="best" id="finalAch"></p>
    <div class="btns">
      <button class="big" id="again" data-i18n="again">Rejouer</button>
      <button class="ghost" id="overShop" data-i18n="shop_btn">🛒 Boutique</button>
      <button class="ghost" id="toMenu" data-i18n="menu_btn">Menu</button>
    </div>
  </div>

  <div class="overlay hidden" id="shop">
    <h2 data-i18n="shop_title">🛒 Boutique</h2>
    <p class="best" id="walletLine"></p>
    <div class="tabs" id="shopTabs"><button data-t="items" data-i18n="tab_items">Objets</button><button data-t="skins" data-i18n="tab_skins">Skins</button></div>
    <button class="ghost small hidden" id="devGold">🛠 +1000 🪙</button>
    <div class="shop-list" id="shopList"></div>
    <p class="hint" data-i18n="shop_hint">Les consommables sont utilisés automatiquement au début de chaque partie.</p>
    <button class="ghost" id="shopBack" data-i18n="back">Retour</button>
  </div>

  <div class="overlay hidden" id="ach">
    <h2 data-i18n="ach_title">🏆 Succès</h2>
    <p class="best" id="achCount"></p>
    <div class="shop-list" id="achList"></div>
    <button class="ghost small hidden" id="achReset" data-i18n="ach_reset">🛠 Réinitialiser les succès</button>
    <button class="ghost" id="achBack" data-i18n="back">Retour</button>
  </div>

  <div class="overlay hidden" id="pause">
    <h2 data-i18n="pause_title">Pause</h2>
    <div class="row"><span data-i18n="lbl_sound">Son</span>
      <div class="seg" data-key="sound"><button data-v="on" data-i18n="opt_on">On</button><button data-v="off" data-i18n="opt_off">Off</button></div></div>
    <div class="btns" style="flex-direction:column">
      <button class="big" id="resumeBtn" data-i18n="resume">▶ Reprendre</button>
      <button class="ghost" id="restartBtn" data-i18n="restart">🔄 Recommencer</button>
      <button class="ghost" id="quitBtn" data-i18n="quit">🏠 Menu principal</button>
    </div>
    <button class="ghost small hidden" id="hitboxBtn">🛠 Hitbox : off</button>
  </div>

  <button class="pausebtn hidden" id="pauseBtn" aria-label="Pause"></button>

  <div id="toast"></div>
</div>

  function parseCol(s){

    return [255,241,214];
  }

       skinOverride:null,achRun:[],reached4:false,t4:0,glides:0,magnetT:0,bonuses:0,pepper:false,mustard:false,hot:false,pepperT:0,cd:0,slowT:0,slowDur:1,slowAmp:0,flash:0,nm:1,

  function dims(){

  /* Géométrie des obstacles : s'adapte au nombre de colonnes (plus facile quand l'écran est scindé) */
  function gapOf(o){
    var n=G.pieces.length, gw=Math.min(.84,o.gw*(1+.2*(n-1))), m=gw/2+.03;

  function hitTest(o,p,lw,r,rf){

    var a=[[c1-w1/2,c1+w1/2],[c2-w2/2,c2+w2/2]].sort(function(x,y){return x[0]-y[0]});
    var left=a[0][0], mid=Math.max(0,a[1][0]-a[0][1]), right=1-Math.max(a[0][1],a[1][1]);

  function genObs(p){
    var SK=curSkin();
    while(p.nextD<G.D+H*1.15){
      var d=G.D, n=G.pieces.length;
      var bladeChance=d<1500?0:Math.min(.38,.12+d/60000);
      var tp=function(){return Math.random()<bladeChance?'blade':'pin'};
      var rk=Math.random(), kind;
      if(d<1200) kind=rk<.6?'gap':'block';
      else if(d<3000) kind=rk<.45?'gap':'block';
      else kind=rk<.35?'gap':(rk<.65?'block':'duo');
      var amp=d<5000?0:Math.min(.14,(d-5000)/150000);

        var gw=Math.max(.42,.62-d/90000), m=gw/2+.03;

      }else if(kind==='block'){
        p.obs.push({kind:'block',type:tp(),d:p.nextD,w:.3+Math.random()*.2,cx:.2+Math.random()*.6,amp:Math.min(amp,.1),ph:Math.random()*6.28,hit:false});
      }else{
        var w1,w2,c1,c2,tries=0;
        do{ w1=.18+Math.random()*.08; w2=.18+Math.random()*.08; c1=.1+Math.random()*.8; c2=.1+Math.random()*.8; tries++; }
        while(tries<8 && !corridorOk(c1,w1,c2,w2));

        p.obs.push({kind:'block',type:tp(),d:p.nextD+off,w:w2,cx:c2,amp:0,ph:0,hit:false});
      }
      var s=Math.max(165,300-d/90)*(.85+Math.random()*.35)*(1+.3*(n-1));
      /* Beurre (fusion) et golds : plus on descend, plus il y a de golds, en grappes de plus en plus longues */
      if(n>=2&&!SK.noMerge&&Math.random()<TUNE.butterRow){
        p.pick.push({k:'fuse',d:p.nextD+s/2,x:.15+Math.random()*.7,taken:false});
      }else if(Math.random()<Math.min(.85,.4+d/25000)){
        var cnt=1+Math.min(4,Math.floor(d/8000))+(Math.random()<.35?1:0);

  function split(p){

  function applyBonus(pk,p){
    var b=BONUS_BY[pk.b], SK=curSkin(), n=G.pieces.length, pos=lanePos(G.pieces.indexOf(p),n,p), k=tm();
    if(b.id==='loan'&&SK.premium) b=BONUS_BY.rain;

    burst(pos.x,H*.3,pk.tier===3?40:14,[col,'#ffffff']);

  function stepParts(dt){
    for(var i=G.parts.length-1;i>=0;i--){
      var q=G.parts[i]; q.life-=dt; if(q.life<=0){G.parts.splice(i,1);continue;}
      q.vy+=900*dt; q.x+=q.vx*dt; q.y+=q.vy*dt;
    }
    G.shake=Math.max(0,G.shake-dt*1.6);
  }
  function update(dt){
    var SK=curSkin();
    G.t+=dt;
    var target=getInput()*1.55;
    G.vx+=(target-G.vx)*Math.min(1,9*dt);
    var ease=Math.min(1,.4+G.t/1.2);
    var malus=settings.mode==='survive'?1+.22*G.lost:1;
    var nt=TUNE.pieceSpeed[Math.min(G.pieces.length,4)-1]; G.nm+=(nt-G.nm)*Math.min(1,3*dt); var nmul=G.nm;
    var pm=1; if(G.slowT>0){ G.slowT-=dt; var rt=Math.max(0,G.slowT)/G.slowDur; pm=1-G.slowAmp*rt*rt; }
    if(G.flash>0) G.flash=Math.max(0,G.flash-dt*4);
    if(G.glide>0) G.glide-=dt;
    if(G.glideCd>0) G.glideCd-=dt;
    if(G.magnetT>0) G.magnetT-=dt;
    if(G.pepperT>0) G.pepperT-=dt;
    var gmul=G.glide>0?.45:1;
    var smul=(SK.speedMul||1)*(G.hot?1.2:1);
    G.D+=(210+Math.min(320,G.D*.018))*malus*nmul*pm*ease*gmul*smul*dt;
    G.score=Math.floor(G.D/60);
    if(G.score>=100) unlock('d100');
    if(G.score>=300) unlock('d300');
    if(G.score>=100&&G.gold===0) unlock('ascete');
    var bi=Math.min(Math.floor(G.D/BIOME_LEN),BIOMES.length-1);
    if(bi!==G.bi){ G.bi=bi; G.banner={text:X(BIOMES[bi].name),t:0}; if(BIOMES[bi].ach) unlock(BIOMES[bi].ach); }
    if(G.pieces.length>=4){ G.t4+=dt; if(G.t4>=10) unlock('quatrequarts'); } else G.t4=0;
    if(G.banner){ G.banner.t+=dt; if(G.banner.t>2.6) G.banner=null; }

    var list=G.pieces.slice();
    for(var k=0;k<list.length;k++){
      var p=list[k];
      if(G.pieces.indexOf(p)<0) continue;
      var dm=dims();
      p.x=clamp(p.x+G.vx*dt,dm.rf,1-dm.rf);
      if(p.inv>0) p.inv-=dt;
      if(p.oven>0) p.oven-=dt;
      genObs(p);
      p.scared=false;

      var mag=!!(SK.magnet||G.magnetT>0);
      var reach=dm.r+(inv.ladle>0?40:14)+(mag?20:0);
      for(var m=0;m<p.pick.length;m++){
        var pk=p.pick[m]; if(pk.taken) continue;
        if(mag&&pk.k==='gold'&&Math.abs(pk.d-G.D)<190) pk.x+=(p.x-pk.x)*Math.min(1,3.5*dt);
        if(Math.abs(pk.d-G.D)<reach && Math.abs(p.x-pk.x)*dm.lw<reach){
          pk.taken=true;
          if(pk.k==='gold'){
            G.gold+=goldMul(); if(G.gold>=40) unlock('picsou'); beep(880+Math.min(G.gold,12)*18,.08,'triangle',.05,220);
            burst(dm.lw*G.pieces.indexOf(p)+pk.x*dm.lw,H*.3,6,['#ffd23f','#fff3b0']);
          }else if(pk.k==='bonus'){ applyBonus(pk,p); break; }
          else{ mergeInto(p); break; }
        }
      }
      dm=dims();
      if(G.pieces.indexOf(p)<0) continue;

      for(var j=0;j<p.obs.length;j++){
        var o=p.obs[j]; if(o.hit) continue;
        var dy=o.d-G.D;
        if(dy>0&&dy<170) p.scared=true;
        if(!hitTest(o,p,dm.lw,dm.r,dm.rf)) continue;
        if(p.inv>0) continue;
        if(o.type==='pin'&&p.oven>0){ unlock('oven'); continue; }
        o.hit=true;
        var ip=G.pieces.indexOf(p), pos=lanePos(ip,dm.n,p);
        if(o.type==='blade'){
          if(SK.spark&&Math.random()<SK.spark){
            unlock('spark'); burst(pos.x,H*.3,24,['#ffd23f','#ff9a1f','#ffffff']); G.shake=.1;
            beep(1400,.09,'square',.05,-500); vib(15);
          }
          else if(G.ketchup>0){ G.ketchup--; burst(pos.x,H*.3,16,['#d1432f','#ff8a73']); toast(tr('toast_ketchup')); beep(300,.15,'triangle',.06,200); unlock('ketchup'); }
          else if(G.pieces.length<MAXP) split(p);
          else crush(p);
        }else{
          if(G.mayo>0){ G.mayo--; burst(pos.x,H*.3,16,['#fff3c4','#ffffff']); toast(tr('toast_mayo')); beep(300,.15,'triangle',.06,200); unlock('mayo'); }
          else crush(p);
        }
        if(state!=='play') return;
        break;
      }
    }
    stepParts(dt);
  }

  /* ---------- Dessin ---------- */
  function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
  function rr(x,y,w,h,r){
    if(w<=0) return; ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2)); else ctx.rect(x,y,w,h);
    ctx.fill();
  }
  function teeth(xa,xb,yb,s){
    if(xb-xa<2) return; ctx.beginPath();
    for(var x=xa;x<xb-1;x+=s){ var w=Math.min(s,xb-x); ctx.moveTo(x,yb); ctx.lineTo(x+w/2,yb-s*.9); ctx.lineTo(x+w,yb); }
    ctx.fill();

  function drawDecor(kind,x0,lw,py,col,seed){

        if(SK.stone) ctx.fillText(tr('tut_stone'),W/2,H*.62+26);
        ctx.globalAlpha=1;
      }
    }
  }

  /* ---------- Boucle ---------- */
  var last=0;
  function frame(ts){
    var dt=Math.min(.033,((ts-last)/1000)||0); last=ts;
    if(G){
      if(state==='play') update(dt);
      else if(state==='menu'){ G.D+=70*dt; G.t+=dt; stepParts(dt); }
      else if(state==='countdown'){ G.cd-=dt; if(G.cd<=0) setState('play'); }
      else if(state==='over') stepParts(dt);
    }
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- Menus & boutique ---------- */
  function syncUI(){
    document.querySelectorAll('.seg').forEach(function(seg){
      var key=seg.getAttribute('data-key');
      seg.querySelectorAll('button').forEach(function(b){
        b.classList.toggle('on',b.getAttribute('data-v')===settings[key]);
      });
    });
    $('hint').textContent=tr(settings.control==='tilt'?'hint_tilt':'hint_tap')+' '+tr(settings.mode==='classic'?'hint_classic':'hint_survive');
    var parts=[];
    if(best>0) parts.push(tr('record',best));
    parts.push(wallet+' 🪙');
    ITEMS.forEach(function(it){ if(it.kind==='cons'&&inv[it.id]>0) parts.push(it.icon+' ×'+inv[it.id]); });
    $('bestLine').textContent=parts.join(' · ');
    $('devBtn').textContent=tr('dev_btn',devOn()?'ON':'off');
    $('devBtn').classList.toggle('on',devOn());
  }

  var shopFrom='menu', shopTab='items';
  function drawSkinPreview(c,sk){
    var x=c.getContext('2d'), s=c.width, r=s*.26;
    x.clearRect(0,0,s,s); x.save(); x.translate(s/2,s/2+s*.1);
    if(sk.cape){ x.fillStyle='#d1432f'; x.beginPath(); x.moveTo(-r*.7,-r*.5); x.lineTo(-r*1.3,-r*1.8); x.lineTo(r*1.3,-r*1.8); x.lineTo(r*.7,-r*.5); x.closePath(); x.fill(); }
    if(sk.magnet) paintMagnet(x,r);
    x.fillStyle=sk.body; x.strokeStyle=sk.edge; x.lineWidth=Math.max(2,r*.12);
    if(sk.stone) stoneShape(x,r*1.03,r*1.2); else { x.beginPath(); x.ellipse(0,0,r*1.03,r*1.2,0,0,7); }
    x.fill(); x.stroke();
    x.fillStyle='#fff'; x.beginPath(); x.arc(-r*.3,-r*.18,r*.24,0,7); x.fill(); x.beginPath(); x.arc(r*.3,-r*.18,r*.24,0,7); x.fill();
    x.fillStyle='#222'; x.beginPath(); x.arc(-r*.3,-r*.18,r*.12,0,7); x.fill(); x.beginPath(); x.arc(r*.3,-r*.18,r*.12,0,7); x.fill();
    x.restore();
  }
  function renderSkins(list){
    var premiumLabel=false;
    SKINS.forEach(function(sk){
      if(sk.premium&&!premiumLabel){
        premiumLabel=true;
        var lab=document.createElement('p'); lab.className='best'; lab.style.margin='6px 0 0';
        lab.textContent=tr('premium_label'); list.appendChild(lab);
      }
      var owned=isOwned(sk), equipped=skinId===sk.id;
      var row=document.createElement('div'); row.className='item';
      var pv=document.createElement('canvas'); pv.width=88; pv.height=88; pv.style.cssText='width:44px;height:44px;flex:none';
      drawSkinPreview(pv,sk); row.appendChild(pv);
      var t=document.createElement('div'); t.className='t';
      var b=document.createElement('b'); b.textContent=X(sk.name)+(sk.premium?' ⭐':'');
      var s2=document.createElement('small'); s2.textContent=sk.premium?X(sk.desc):tr('skin_cosmetic');
      t.appendChild(b); t.appendChild(s2); row.appendChild(t);
      var btn=document.createElement('button'); btn.className='ghost';
      if(equipped){ btn.textContent=tr('equipped'); btn.disabled=true; }
      else if(owned){
        btn.textContent=tr('equip');
        btn.addEventListener('click',function(){ skinId=sk.id; applySkin(); save(); renderShop(); });
      }else if(sk.premium){
        btn.textContent=tr('try_price',sk.priceEur);
        btn.addEventListener('click',function(){ skinId=sk.id; applySkin(); renderShop(); toast(tr('toast_demo')); });
      }else{
        var pr=priceOf(sk.price); btn.textContent=pr+' 🪙'; btn.disabled=wallet<pr;
        btn.addEventListener('click',function(){
          if(wallet<pr) return;
          wallet-=pr; ownedSkins[sk.id]=true; skinId=sk.id; applySkin(); save(); renderShop(); if(Object.keys(ownedSkins).length>=3) unlock('garderobe'); beep(700,.1,'triangle',.06,300);
        });
      }
      row.appendChild(btn); list.appendChild(row);
    });
  }
  function renderShop(){
    $('walletLine').textContent=tr('wallet',wallet)+(devOn()?tr('dev_suffix'):'');
    $('devGold').classList.toggle('hidden',!devOn());
    document.querySelectorAll('#shopTabs button').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-t')===shopTab); });
    var list=$('shopList'); list.innerHTML='';
    if(shopTab==='skins'){ renderSkins(list); return; }
    ITEMS.forEach(function(it){
      var owned=inv[it.id]||0, row=document.createElement('div'); row.className='item';
      var t=document.createElement('div'); t.className='t';
      var b=document.createElement('b'); b.textContent=it.icon+' '+X(it.name)+(it.kind==='cons'&&owned?'  ×'+owned:'');
      var s2=document.createElement('small'); s2.textContent=tr(it.kind==='cons'?'kind_cons':'kind_pass')+X(it.desc);
      t.appendChild(b); t.appendChild(s2); row.appendChild(t);
      var btn=document.createElement('button'); btn.className='ghost';
      if(it.kind==='pass'&&owned){ btn.textContent=tr('owned'); btn.disabled=true; }
      else if(devOn()){
        btn.textContent=tr(it.kind==='cons'?'plus5':'get_dev');
        btn.addEventListener('click',function(){ inv[it.id]=it.kind==='cons'?(inv[it.id]||0)+5:1; save(); renderShop(); beep(700,.1,'triangle',.06,300); });
      }else{
        var pr=priceOf(it.price); btn.textContent=pr+' 🪙'; btn.disabled=wallet<pr;
        btn.addEventListener('click',function(){
          if(wallet<pr) return;
          wallet-=pr; inv[it.id]=(inv[it.id]||0)+1; save(); renderShop(); beep(700,.1,'triangle',.06,300);
        });
      }
      row.appendChild(btn); list.appendChild(row);
    });
  }
  function showShop(from){
    shopFrom=from; $('menu').classList.add('hidden'); $('over').classList.add('hidden');
    renderShop(); $('shop').classList.remove('hidden');
  }
  document.querySelectorAll('#shopTabs button').forEach(function(b){
    b.addEventListener('click',function(){ shopTab=b.getAttribute('data-t'); renderShop(); });
  });
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click',function(){
      var key=b.parentNode.getAttribute('data-key');
      settings[key]=b.getAttribute('data-v'); save();
      if(key==='lang') applyI18n(); else syncUI();
    });
  });
  $('devBtn').addEventListener('click',function(){
    settings.dev=devOn()?'off':'on';
    if(!devOn()&&!isOwned(skinById(skinId))){ skinId='classic'; applySkin(); }
    save(); syncUI();
    toast(tr(devOn()?'toast_dev_on':'toast_dev_off'));
  });
  $('devGold').addEventListener('click',function(){ wallet+=1000; save(); renderShop(); beep(880,.1,'triangle',.06,300); });

  function renderAch(){
    var list=$('achList'); list.innerHTML='';
    var done=ACHS.filter(function(a){return ach[a.id]}).length;
    $('achCount').textContent=tr('ach_count',done,ACHS.length);
    $('achReset').classList.toggle('hidden',!devOn());
    ACHS.forEach(function(a){
      var ok=!!ach[a.id], show=ok||!a.secret, row=document.createElement('div');
      row.className='item '+(ok?'done':'locked');
      var ic=document.createElement('div'); ic.style.cssText='font-size:1.6rem;flex:none;width:34px;text-align:center'; ic.textContent=show?a.icon:'❓';
      var t=document.createElement('div'); t.className='t';
      var b=document.createElement('b'); b.textContent=show?X(a.name):'???';
      var s2=document.createElement('small'); s2.textContent=show?X(a.desc):tr('ach_secret');
      t.appendChild(b); t.appendChild(s2);
      var rw=document.createElement('div'); rw.className='rw'; rw.textContent=(ok?'✓ ':'')+'+'+a.reward+' 🪙';
      row.appendChild(ic); row.appendChild(t); row.appendChild(rw); list.appendChild(row);
    });
  }
  $('openAch').addEventListener('click',function(){ $('menu').classList.add('hidden'); renderAch(); $('ach').classList.remove('hidden'); });
  $('achBack').addEventListener('click',function(){ $('ach').classList.add('hidden'); $('menu').classList.remove('hidden'); syncUI(); });
  $('achReset').addEventListener('click',function(){ ach={}; stats.runs=0; save(); renderAch(); toast(tr('toast_ach_reset')); });

  /* ---------- Pause / reprise ---------- */
  var ICON_PAUSE='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>';
  var ICON_PLAY='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>';
  function setState(st){
    state=st;
    var inG=(st==='play'||st==='paused'||st==='countdown');
    $('pauseBtn').classList.toggle('hidden',!inG);
    $('pauseBtn').innerHTML=(st==='paused')?ICON_PLAY:ICON_PAUSE;
  }
  function renderPause(){
    $('hitboxBtn').classList.toggle('hidden',!devOn());
    $('hitboxBtn').textContent=tr('hitbox_btn',settings.hitbox==='on'?'ON':'off');
    syncUI();
  }
  function pause(){
    if(state!=='play'&&state!=='countdown') return;
    touches.clear(); starts.clear(); tapDir=0; keyDir=0;
    setState('paused'); renderPause(); $('pause').classList.remove('hidden');
  }
  function resume(){
    if(state!=='paused') return;
    $('pause').classList.add('hidden'); G.cd=2.1; setState('countdown');
  }
  function endRunEarly(){
    if(!G) return;
    wallet+=G.gold; if(G.score>best) best=G.score; stats.runs++; save();
    if(stats.runs>=10) unlock('accro');
  }
  $('pauseBtn').addEventListener('click',function(){
    if(state==='paused') resume(); else pause();
    if($('pauseBtn').blur) $('pauseBtn').blur();
  });
  $('resumeBtn').addEventListener('click',resume);
  $('restartBtn').addEventListener('click',function(){ endRunEarly(); $('pause').classList.add('hidden'); startGame(); });
  $('quitBtn').addEventListener('click',function(){
    endRunEarly(); $('pause').classList.add('hidden'); setState('menu');
    $('menu').classList.remove('hidden'); newGame(); syncUI();
  });
  $('hitboxBtn').addEventListener('click',function(){ settings.hitbox=settings.hitbox==='on'?'off':'on'; renderPause(); });
  if(document.addEventListener) document.addEventListener('visibilitychange',function(){ if(document.hidden) pause(); });

  function startGame(){
    newGame(); setState('play');
    if(inv.ketchup>0){ inv.ketchup--; G.ketchup=1; }
    if(inv.mayo>0){ inv.mayo--; G.mayo=1; }
    if(inv.pepper>0){ inv.pepper--; G.pepper=true; }
    if(inv.mustard>0){ inv.mustard--; G.mustard=true; }
    if(inv.hot>0){ inv.hot--; G.hot=true; }
    save();
    $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('shop').classList.add('hidden'); $('ach').classList.add('hidden'); $('pause').classList.add('hidden');
    if(activeControl==='tilt'){
      setTimeout(function(){
        if(state==='play'&&activeControl==='tilt'&&!tiltSeen){
          activeControl='tap'; toast(tr('toast_sensor'));
        }
      },1600);
    }
  }
  $('play').addEventListener('click',function(){
    try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.resume) ac.resume(); }catch(e){}
    if(settings.control==='tilt'){
      enableTilt().then(function(ok){
        activeControl=ok?'tilt':'tap';
        if(!ok) toast(tr('toast_tilt_denied'));
        startGame();
      });
    }else{ activeControl='tap'; startGame(); }
  });
  $('again').addEventListener('click',startGame);
  $('openShop').addEventListener('click',function(){ showShop('menu'); });
  $('overShop').addEventListener('click',function(){ showShop('over'); });
  $('shopBack').addEventListener('click',function(){
    $('shop').classList.add('hidden');
    $(shopFrom==='over'?'over':'menu').classList.remove('hidden'); syncUI();
  });
  $('toMenu').addEventListener('click',function(){
    setState('menu'); $('over').classList.add('hidden'); $('menu').classList.remove('hidden'); newGame(); syncUI();
  });

  resize(); newGame(); applyI18n();
  requestAnimationFrame(function(){ resize(); requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
